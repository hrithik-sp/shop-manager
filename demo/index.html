<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101412">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shop Manager">
<title>Shop Manager (demo)</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../icon-192.png">
<link rel="apple-touch-icon" href="../icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Mukta:wght@400;600&display=swap">
<style>
:root{
  /* Layout: phone-first app shell. Top bar, one scrolling screen, bottom tab bar. Dark by default. */
  --bg:#101412; --surface:#191E1B; --surface-2:#232A25; --surface-3:#2E3630;
  --ink:#ECEFEA; --muted:#A3ADA6; --line:#343C36;
  --accent:#F4BE2E; --accent-ink:#221900; --accent-soft:#3A300F;
  --chaat:#F08A70; --chaat-soft:#3A221B; --tea:#6CC6B2; --tea-soft:#16302A;
  --good:#6BCB8F; --good-soft:#163222; --bad:#FF8A7A; --bad-soft:#3D1D19; --warn:#F2A64A; --warn-soft:#38270F;
  --focus:#8FB0FF;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Mukta","Segoe UI",Roboto,system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F2F4EF; --surface:#FFFFFF; --surface-2:#E8ECE5; --surface-3:#DCE2D8;
  --ink:#18201B; --muted:#56615A; --line:#D2D9CE;
  --accent:#F2B417; --accent-ink:#2A1E00; --accent-soft:#FDF0C8;
  --chaat:#A93B25; --chaat-soft:#F8E6E0; --tea:#1F6658; --tea-soft:#DFF0EA;
  --good:#24774A; --good-soft:#DDF1E4; --bad:#B3321F; --bad-soft:#FBE2DD; --warn:#995600; --warn-soft:#FCEBD2;
  --focus:#2356C4;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.45 var(--body);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* shell */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.top__in{display:flex;align-items:center;gap:10px;min-height:56px;max-width:720px;margin:0 auto}
.top h1{font:700 22px/1.1 var(--display);margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:none;border:0;padding:6px 0;min-height:40px}
.sync i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"] i{background:var(--good)}
.sync[data-s="busy"] i{background:var(--accent)}
.sync[data-s="off"] i{background:var(--warn)}
.view{max-width:720px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(110px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:0 max(4px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-left,0px))}
.tabs__in{display:grid;grid-template-columns:repeat(5,1fr);max-width:720px;margin:0 auto}
.tab{display:grid;justify-items:center;gap:2px;padding:8px 2px 10px;background:none;border:0;color:var(--muted);font-size:12.5px;font-weight:600;min-height:62px}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--accent)}

/* type */
.h2{font:700 24px/1.15 var(--display);margin:14px 0 6px}
.h3{font:700 18px/1.2 var(--display);margin:18px 0 8px}
.muted{color:var(--muted)}
.small{font-size:14px}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0 0 8px}

/* building blocks */
.card{background:var(--surface);border-radius:16px;padding:14px 16px;margin:10px 0}
.card--tap{display:block;width:100%;text-align:left;border:0}
.row{display:flex;align-items:center;gap:10px}
.row--between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:grid;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{display:grid;gap:8px}
.divider{height:1px;background:var(--line);margin:10px 0}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.pill--good{background:var(--good-soft);color:var(--good)}
.pill--bad{background:var(--bad-soft);color:var(--bad)}
.pill--warn{background:var(--warn-soft);color:var(--warn)}
.pill--chaat{background:var(--chaat-soft);color:var(--chaat)}
.pill--tea{background:var(--tea-soft);color:var(--tea)}
.up{color:var(--good)} .down{color:var(--bad)}

/* stat tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.tile{background:var(--surface);border-radius:16px;padding:12px 14px;min-width:0}
.tile__l{font-size:13px;color:var(--muted);font-weight:600}
.tile__v{font:700 26px/1.15 var(--display);font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.tile__s{font-size:13px;color:var(--muted);margin-top:2px}
.tile--wide{grid-column:1/-1}
.tile--hero .tile__v{font-size:34px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:14px;border:1.5px solid transparent;font-weight:600;line-height:1.2;text-decoration:none}
.btn--primary{background:var(--accent);color:var(--accent-ink)}
.btn--ghost{background:transparent;border-color:var(--line)}
.btn--soft{background:var(--surface-2)}
.btn--danger{background:var(--bad-soft);color:var(--bad)}
.btn--block{width:100%}
.btn--big{min-height:58px;font-size:19px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;min-height:40px}
.iconbtn{width:46px;height:46px;flex:none;display:grid;place-items:center;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;line-height:1}

/* shop switch */
.shops{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);padding:5px;border-radius:14px;margin:6px 0 10px}
.shops button{min-height:44px;border:0;border-radius:10px;background:none;font-weight:600;color:var(--muted)}
.shops button[aria-pressed="true"]{background:var(--surface-3);color:var(--ink)}
.shops button[data-shop="chaat"][aria-pressed="true"]{background:var(--chaat-soft);color:var(--chaat)}
.shops button[data-shop="tea"][aria-pressed="true"]{background:var(--tea-soft);color:var(--tea)}

/* date bar */
.datebar{display:flex;align-items:center;gap:8px;margin:4px 0 8px}
.datebar .date{flex:1;text-align:center;font-weight:600;min-height:46px;display:grid;place-items:center;background:var(--surface);border-radius:12px;position:relative}
.datebar input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%}

/* forms */
.field{display:grid;gap:6px;margin:10px 0}
.field > span{font-size:14px;color:var(--muted);font-weight:600}
.in{width:100%;min-height:50px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.in:focus{outline:none;border-color:var(--focus)}
textarea.in{min-height:80px;resize:vertical}
.money{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.money:focus-within{border-color:var(--focus)}
.money b{display:grid;place-items:center;padding:0 14px;background:var(--surface-2);color:var(--muted)}
.money .in{border:0;border-radius:0;font:700 22px/1 var(--display);font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}

/* sales counters */
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--surface);border-radius:16px;padding:10px;display:grid;gap:8px;border:1.5px solid transparent}
.item--on{border-color:var(--accent)}
.item__top{display:flex;align-items:center;gap:8px;min-width:0}
.item__ico{font-size:28px;line-height:1;flex:none}
.item__name{font-weight:600;line-height:1.2;min-width:0;overflow-wrap:anywhere}
.item__price{font-size:13px;color:var(--muted)}
.ctr{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:4px}
.ctr button{height:48px;border-radius:12px;border:0;background:var(--surface-2);font:700 24px/1 var(--body)}
.ctr button.plus{background:var(--accent);color:var(--accent-ink)}
.ctr input{width:100%;min-width:0;height:48px;text-align:center;border:0;background:none;font:700 24px/1 var(--display);font-variant-numeric:tabular-nums}
.sumbar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--surface-3);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.sumbar__in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.sumbar b{font:700 24px/1 var(--display);font-variant-numeric:tabular-nums}
.view--sum{padding-bottom:calc(180px + env(safe-area-inset-bottom,0px))}

/* list rows */
.li{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:12px 14px;width:100%;border:0;text-align:left}
.li__ico{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);font-size:22px}
.li__main{flex:1;min-width:0}
.li__t{font-weight:600;overflow-wrap:anywhere}
.li__s{font-size:13.5px;color:var(--muted)}
.li__v{font:700 18px/1.2 var(--display);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* bars chart */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(80px,38%) 1fr auto;align-items:center;gap:8px;font-size:14px}
.bar__l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar__t{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.bar__f{height:100%;border-radius:7px;background:var(--accent)}
.bar__f--chaat{background:var(--chaat)} .bar__f--tea{background:var(--tea)}
.bar__v{font-variant-numeric:tabular-nums;font-weight:600}
.cols{display:flex;align-items:flex-end;gap:4px;height:140px;padding-top:8px}
.col{flex:1;display:grid;align-content:end;justify-items:center;gap:4px;min-width:0;height:100%}
.col__f{width:100%;max-width:26px;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:2px}
.col__f--now{background:var(--good)}
.col__l{font-size:11px;color:var(--muted)}

/* table */
.tablewrap{overflow-x:auto;margin:8px 0}
table.t{border-collapse:collapse;width:100%;font-size:14.5px}
.t th,.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.t td.r,.t th.r{text-align:right;font-variant-numeric:tabular-nums}

/* sheet (modal) */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet__bg{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.sheet__p{position:relative;width:min(720px,100%);max-height:92%;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet__h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.sheet__h h2{font:700 22px/1.2 var(--display);margin:0;flex:1}

/* PIN pad */
.pin{max-width:360px;margin:0 auto;padding-top:20px;text-align:center}
.dots{display:flex;justify-content:center;gap:14px;margin:18px 0}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{height:68px;border-radius:18px;border:0;background:var(--surface);font:700 28px/1 var(--display)}
.brand{font:700 34px/1.05 var(--display);margin:6px 0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:12px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:15px;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;min-height:36px;padding:0}
.empty{padding:22px 16px;text-align:center;color:var(--muted);background:var(--surface);border-radius:16px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--warn-soft);color:var(--ink);margin:8px 0}
.alert--bad{background:var(--bad-soft)}
.alert--good{background:var(--good-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.demo-strip{background:var(--accent-soft);color:var(--ink);font-size:14px;line-height:1.35;text-align:center;padding:8px 16px;border-bottom:1px solid var(--line)}
/* Close the day: big date and step bar */
.bigdate{text-align:center;line-height:1.1}
.bigdate div{font:700 26px/1.15 var(--display)}
.steps{display:flex;gap:4px;overflow-x:auto;margin:10px 0 12px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps__s{flex:1 0 auto;display:grid;justify-items:center;gap:4px;background:none;border:0;color:var(--muted);font-size:12px;font-weight:600;padding:4px 2px;min-width:54px}
.steps__s i{display:block;width:100%;height:5px;border-radius:3px;background:var(--surface-3)}
.steps__s.done i{background:var(--good)}
.steps__s.on i{background:var(--accent)}
.steps__s.on{color:var(--ink)}
/* Item photos */
.item__img{width:40px;height:40px;border-radius:10px;object-fit:cover;flex:none}
.item__img--big{width:64px;height:64px}
.li__img{width:32px;height:32px;border-radius:8px;object-fit:cover;display:block}
.leak{padding:8px 0;border-top:1px solid var(--line)}
.leak:first-of-type{border-top:0}
.leak p{margin:4px 0 0}
/* Chaat counter tally: pictures only, full screen */
.tally{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);padding:env(safe-area-inset-top,0px) 10px env(safe-area-inset-bottom,0px)}
.tally__grid{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));grid-auto-rows:minmax(118px,1fr);gap:10px;overflow:auto;padding:54px 0 10px}
.tally__t{position:relative;border:0;border-radius:20px;background:hsl(var(--hue) 32% 22%);display:grid;place-items:center;padding:8px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:root[data-theme="light"] .tally__t{background:hsl(var(--hue) 60% 88%)}
.tally__t .item__ico{font-size:64px}
.tally__img{width:100%;height:100%;max-height:160px;object-fit:cover;border-radius:14px}
.tally__n{position:absolute;top:8px;right:8px;min-width:40px;padding:4px 8px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font:700 22px/1.2 var(--display);text-align:center}
.tally__t--hit{animation:tallyhit .25s}
@keyframes tallyhit{from{transform:scale(.92);filter:brightness(1.5)}to{transform:none}}
.tally__bar{display:flex;align-items:center;gap:14px;padding:10px 0}
.tally__undo{flex:1;height:84px;border:0;border-radius:22px;background:var(--surface-3);color:var(--ink);font:700 44px/1 var(--display)}
.tally__total{min-width:70px;text-align:center;font:700 30px/1 var(--display);color:var(--muted)}
.tally__exit{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);color:var(--muted);font-size:18px;z-index:2;touch-action:none}
.tally__exit.holding{background:var(--bad-soft);color:var(--bad);transition:background 1.5s linear}

</style>
</head>
<body>
<div id="app"></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript>Shop Manager needs JavaScript. Open it in Chrome or Safari.</noscript>
<script>
(function () {
'use strict';
/* Starting data from Prashanth's questionnaire (code MMVQ-WG4A), his follow-ups and the 17 Nov answers.
   Everything here can be changed in the app; prices left as 0 still need setting. */
const DEMO = true; // the build sets this to true for the reviewers' demo link
const SEED = {
  settings() {
    return {
      id: 'settings', kind: 'settings', schema: 1,
      shops: {
        chaat: {name: 'Chaat', open: '14:00', close: '22:00', rent: 40000, deposit: 100000, investment: 150000},
        tea: {name: 'Tea', open: '04:00', close: '23:30', rent: 48000, deposit: 100000, investment: 200000}
      },
      // Monthly running costs other than rent, spread across each day (shared = split between open shops).
      fixed: [
        {name: 'Electricity (BESCOM)', amount: 3000, shop: 'shared'},
        {name: 'Water tanker / bill', amount: 6000, shop: 'shared'},
        {name: 'Drinking water cans', amount: 4200, shop: 'shared'}
      ],
      overtimeRate: 50,
      floatChaat: 0, floatTea: 0,
      milkMlPerCup: 54, teaGPerCup: 2.4, purisPerPlate: 6, purisPerPacket: 100
    };
  },
  items() {
    const C = (name, price, icon, extra) => Object.assign({kind: 'item', shop: 'chaat', name, price, icon, cost: 0, active: true}, extra || {});
    const T = (name, price, icon, extra) => Object.assign({kind: 'item', shop: 'tea', name, price, icon, cost: 0, active: true}, extra || {});
    return [
      C('Pani puri', 40, '🥣'), C('Masala puri', 50, '🍛'), C('Sev puri', 50, '🍘'), C('Dahi puri', 50, '🥛'),
      C('Bhel puri', 50, '🥗'), C('Nippattu masala', 50, '🍪'), C('Samosa chaat', 50, '🥟'), C('Kachori chaat', 50, '🧆'),
      C('Churumuri', 50, '🌶️'), C('Papdi chaat', 50, '🫓'), C('Bajji (4 pcs)', 40, '🍤'),
      C('Vada pav', 0, '🍔'), C('Plain samosa/kachori', 0, '🥟'),
      C('Water bottle / cool drink', 10, '💧', {resale: true}), C('Parcel charge', 5, '🛍️', {parcel: true}),
      T('Regular tea', 15, '🍵'), T('Ginger tea', 20, '🫚'), T('Lemon tea', 20, '🍋'), T('Black tea', 12, '🫖'),
      T('Instant coffee', 18, '☕'), T('Black coffee', 12, '☕'), T('Boost/Horlicks', 20, '🥤'), T('Hot milk', 20, '🥛'),
      T('Tea/coffee parcel', 30, '🛍️', {parcel: true}),
      T('Loose biscuit', 3, '🍪', {resale: true}), T('Rusk', 5, '🍞', {resale: true}), T('Cake slice', 5, '🍰', {resale: true}),
      T('Biscuit packet', 0, '🍪', {resale: true}), T('Bun', 0, '🥯', {resale: true}),
      T('Cigarettes', 20, '🚬', {resale: true}), T('Water bottle', 10, '💧', {resale: true}), T('Cool drink', 15, '🥤', {resale: true})
    ].map((r, i) => Object.assign(r, {id: 'item:' + r.shop + ':' + i, order: i}));
  },
  stock() {
    const s = (name, unit, shop, low, cost) => ({kind: 'stock', name, unit, shop, low, cost, active: true});
    return [
      s('Milk', 'L', 'tea', 10, 80), s('Tea powder', 'kg', 'tea', 2, 320), s('Coffee powder', 'kg', 'tea', 0.3, 1000),
      s('Sugar', 'kg', 'both', 5, 0), s('Cigarettes', 'pcs', 'tea', 100, 0), s('Oil', 'L', 'chaat', 4, 0),

/** Three-way merge: start from the server copy and re-apply only what this phone changed. */
const MAPS = ['counts', 'prices', 'marks', 'ot', 'notes', 'tags'];
function merge3(orig, mine, theirs) {
  orig = orig || {};
  const out = Object.assign({}, clean(theirs));
  const keys = new Set(Object.keys(mine).concat(Object.keys(orig)));
  keys.forEach(k => {
    if (['id', 'kind', 'updatedAt', 'by', 'seq', '_dirty', '_orig'].includes(k)) return;
    const a = orig[k], b = mine[k];
    if (MAPS.includes(k) && b && typeof b === 'object' && !Array.isArray(b)) {
      const m = Object.assign({}, theirs[k] || {}), ao = a || {};
      new Set(Object.keys(b).concat(Object.keys(ao))).forEach(sk => {
        if (JSON.stringify(b[sk]) === JSON.stringify(ao[sk])) return;
        if (b[sk] === undefined) delete m[sk]; else m[sk] = b[sk];

      out[k] = m;
    } else if (k === 'tags' && Array.isArray(b)) {
      const added = b.filter(x => !(a || []).includes(x)), gone = (a || []).filter(x => !b.includes(x));

async function api(op, body) {

let syncT = null;
function queueSync(ms) { clearTimeout(syncT); syncT = setTimeout(() => sync().catch(() => {}), ms); }
async function sync() {
  clearTimeout(syncT);
  if (!S.session || S.syncing) return;
  S.syncing = true; notify();
  const dirty = [];
  S.recs.forEach(r => { if (r._dirty) dirty.push(r); });
  const sent = dirty.map(r => Object.assign(clean(r), {base: r._orig ? r._orig.updatedAt || 0 : 0}));
  let again = false;
  try {
    const d = await api('sync', {since: S.seq, changes: sent});
    const keep = [];
    const conflicts = new Map((d.conflicts || []).map(c => [c.id, c]));
    dirty.forEach(r => {
      const now = S.recs.get(r.id);
      if (!now) return;
      const theirs = conflicts.get(r.id);
      if (theirs) {
        // Someone else changed this record first: merge both edits and send again.
        const merged = Object.assign(merge3(now._orig, now, theirs), {id: r.id, kind: now.kind, updatedAt: Math.max(Date.now(), (theirs.updatedAt || 0) + 1), by: now.by, _orig: clean(theirs), _dirty: 1});
        S.recs.set(r.id, merged); keep.push(merged); again = true;
      } else if (now.updatedAt === r.updatedAt) { delete now._dirty; delete now._orig; keep.push(now); }
    });
    d.changes.forEach(c => {
      if (conflicts.has(c.id)) return;
      const mine = S.recs.get(c.id);
      if (mine && mine._dirty) return;   // my newer edit is still waiting; the server will tell if it clashes
      S.recs.set(c.id, c); keep.push(c);
    });
    await DB.putMany(keep);
    S.seq = d.seq; LS.set('seq', d.seq);
    S.lastSync = Date.now(); LS.set('lastSync', S.lastSync);
    if (d.user) { S.session.user = d.user; LS.set('session', S.session); }
    S.online = true;
  } catch (e) {
    S.online = navigator.onLine !== false && !/fetch|network|Failed/i.test(String(e.message));
    queueSync(30000);
    throw e;
  } finally {
    S.syncing = false; notify();
  }
  migrate();
  if (again) queueSync(300);
}

async function pinHash(pin, salt) {
  const text = 'shop-manager:' + salt + ':' + pin;
  const data = typeof TextEncoder !== 'undefined' ? new TextEncoder().encode(text) : Array.from(text, ch => ch.charCodeAt(0));
  if (window.crypto && crypto.subtle && typeof TextEncoder !== 'undefined') {
    const buf = await crypto.subtle.digest('SHA-256', data);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }
  let h = 0; for (const b of data) h = (h * 31 + b) | 0; return 'x' + h;

// ---------- suppliers (P0-2: paid in advance, delivered daily) ----------

// ---------- costs ----------
const boxOf = e => e.pay === 'cash' ? (e.box || (e.shop === 'chaat' ? 'chaat' : 'tea')) : null;

  (st.fixed || []).forEach(f => {

/** Every cost charged to one day, as named lines. This is the one place that decides what a day costs,

// ---------- workers ----------
const workers = () => all('worker').filter(w => w.active !== false).sort((a, b) => (a.shop || '').localeCompare(b.shop || '') || a.name.localeCompare(b.name));

// ---------- cash boxes (one per shop, P0-4) ----------
const wpayBox = p => p.box || ((get(p.worker) || {}).shop === 'chaat' ? 'chaat' : 'tea');

// ---------- day and period summaries ----------
function daySummary(date, shop) {

    const s = saleTotals(date, shop), c = dayCost(date, shop);

      units: s.units, entered: s.entered, spend: c.spend, wages: c.wages, fixed: c.fixed, cost: c.total, lines: c.lines, profit: s.sales - c.total, byItem: s.byItem};

}

    lines.sort((a, b) => b.amount - a.amount);

      sales: sum('sales'), spend: sum('spend'), wages: sum('wages'), fixed: sum('fixed'), cost: sum('cost'), profit: sum('profit'),

}

}

      const m = map[id] || (map[id] = {n: 0, sales: 0});

    });

// ---------- stock ----------
const stockItems = () => all('stock').filter(s => s.active !== false).sort((a, b) => (a.order || 0) - (b.order || 0));

    const out = all('expense').filter(e => e.stock === sId).map(e => ({date: e.date, qty: Number(e.qty) || 0}));
    suppliers().filter(s => s.stock === sId).forEach(sup => all('delivery').filter(d => d.supplier === sup.id).forEach(d => out.push({date: d.date, qty: Number(d.qty) || 0})));

}
const inBetween = (sId, after, upto) => sumBy(stockIn(sId).filter(x => (!after || x.date > after) && (!upto || x.date <= upto)), x => x.qty);

    const last = counts[0];

    // Average daily use from the last pairs of counts: opening + bought − closing.

      const u = Number(a.counts[s.id]) + inBetween(s.id, a.date, b.date) - Number(b.counts[s.id]);

/** Stock used between two dates, from the counts nearest the ends. */

function shoppingList() {

    if (fromSupplier.has(s.id)) return;
    const l = stockLevel(s), pack = Number(s.pack) || 0;
    if (l.perDay && l.level != null) {
      const need = l.perDay * 2 - l.level;

      else out.push([s.name, `${qty(WHOLE_UNITS.test(s.unit) ? Math.ceil(need) : Math.ceil(need * 10) / 10)} ${s.unit}`]);

// ---------- predictions ----------
// Days tagged like this sell less (K6a), so they are left out of the averages (P3-8).
const SKIP_TAGS = ['Rain', 'Holiday', 'Festival', 'Closed', 'Power cut'];
const unusualDay = d => { const t = get('tag:' + d); return !!(t && (t.tags || []).some(x => SKIP_TAGS.includes(x))); };
function pickDays(date, shop, ok) {
  const same = [], recent = [];
  for (let i = 1; i <= 28; i++) {
    const d = addDays(date, -i);
    if (unusualDay(d) || !ok(d)) continue;
    if (i % 7 === 0) same.push(d);
    if (recent.length < 7) recent.push(d);

  return same.length >= 2 ? same : recent;
}
// Expected count for an item: average of the last 4 same weekdays, else of the last 7 normal days.
function expectedCount(itemId, shop, date) {
  const ds = pickDays(date, shop, d => { const r = saleOf(d, shop); return !!(r && r.counts && Object.keys(r.counts).length); });
  return ds.length ? sumBy(ds, d => saleOf(d, shop).counts[itemId]) / ds.length : null;
}
function expectedSales(date, shop) {
  let total = 0, any = false;
  SHOP_KEYS.filter(s => inShop(s, shop) && isOpen(s, date)).forEach(s => {
    const ds = pickDays(date, s, d => saleTotals(d, s).entered);
    if (!ds.length) return;
    any = true; total += sumBy(ds, d => saleTotals(d, s).sales) / ds.length;
  });
  return any ? total : null;
}
function avgSales(shop, upto) {
  const ds = range(addDays(upto, -27), upto).filter(d => !unusualDay(d) && saleTotals(d, shop).entered);
  return ds.length ? sumBy(ds, d => saleTotals(d, shop).sales) / ds.length : null;
}
function forecast(date, shop) {
  const rows = items(shop).filter(i => !i.parcel && salesMode(i.shop) === 'items').map(i => ({item: i, n: expectedCount(i.id, i.shop, date)})).filter(r => r.n != null);
  const sales = expectedSales(date, shop);

}
function prepPlan(date) {
  const st = settings(), t = today();
  const out = {};
  const sup = milkSupplier();
  if (sup) {
    const s = sup.stock ? get(sup.stock) : null, l = s ? stockLevel(s) : null;
    const base = (l && l.perDay) || Number(sup.usual) || 0;
    const fc = expectedSales(date, 'tea'), avg = avgSales('tea', t);
    const ratio = fc && avg ? Math.min(1.3, Math.max(0.7, fc / avg)) : 1;
    // Only what was counted at today's closing is really left over; earlier counts would include today's delivery.
    const onHand = l && l.level != null && l.lastCount === t ? Math.max(0, l.level) : 0;
    out.milk = {need: base * ratio, onHand, order: Math.max(0, Math.round(base * ratio - onHand)), unit: sup.unit || 'L', vendor: sup.name};
  }
  const plates = sumBy(forecast(date, 'chaat').rows.filter(r => /pani puri|masala puri/i.test(r.item.name)), r => r.n);
  if (plates) {
    const puris = plates * (Number(st.purisPerPlate) || 8);
    out.puris = {plates: Math.round(plates), puris: Math.round(puris), buckets: st.purisPerBucket ? puris / st.purisPerBucket : null};
  }

}
function gasForecast() {
  const by = {};
  all('expense').filter(e => catOf(e.cat).gas).forEach(e => { const c = e.counter || shopName(e.shop); (by[c] = by[c] || []).push(e.date); });
  return Object.keys(by).filter(c => c !== 'Bajji' || settings().bajjiOn).map(counter => {
    const ds = by[counter].sort();
    const gaps = [];
    for (let i = 1; i < ds.length; i++) gaps.push(daysBetween(ds[i - 1], ds[i]));
    const g = gaps.filter(x => x > 0).slice(-5);
    const avg = g.length ? g.reduce((a, b) => a + b, 0) / g.length : null;

function breakEven(shop) {

/** Investment payback for one shop or both, counted from the opening dates (P0-9). */

  const p = periodSummary(start, t, shop);

// ---------- leakage check (P3, weekly) ----------
function leakageCheck(end) {

  return {text: Math.abs(gap) < 1 ? `${rs(value)} from items · matches money ✓` : `${rs(value)} from items · received ${rs(got)} (${gap > 0 ? '+' : '−'}${rs(Math.abs(gap))})`, cls: Math.abs(gap) < 20 ? 'up' : 'down'};
}

function repeatables(date) {

  return onDate('expense', addDays(date, -1)).filter(e => { const c = catOf(e.cat); return !c.fixed && !c.owner && !c.advance && !c.gas && !have.has(key(e)); });

function copyExpense(e, date) {

// Bill photo (questionnaire F5a). Uploads to the owner's Google Drive when online.
function photoPicker(e) {
  const status = h('span', {class: 'small muted'}, e.photo ? 'Photo saved ✓' : '');
  const inp = h('input', {type: 'file', accept: 'image/*', capture: 'environment', hidden: true});
  inp.addEventListener('change', async () => {
    const f = inp.files[0]; if (!f) return;
    status.textContent = 'Uploading…';
    try {
      const b64 = await shrinkPhoto(f);
      const d = await api('photo', {name: `bill-${e.date}-${Date.now()}.jpg`, mime: 'image/jpeg', b64});
      e.photo = d.url; status.textContent = 'Photo saved ✓';
    } catch (err) { status.textContent = 'Could not upload: ' + err.message; }
  });
  return h('div', {class: 'row', style: 'margin:10px 0'}, h('button', {type: 'button', class: 'btn btn--soft', onclick: () => inp.click()}, '📷 Bill photo'), status, inp);
}
function shrinkPhoto(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.75).split(',')[1]);
    };
    img.onerror = () => rej(new Error('not an image'));
    img.src = url;
  });
}

const stockQty = (s, n) => s.unit === '₹' ? rs(n) : `${qty(WHOLE_UNITS.test(s.unit) ? Math.round(n) : Math.round(n * 10) / 10)} ${s.unit}`;

/** Closing count inputs. Pieces, packets and buckets are whole numbers. */
function countFields(rec, list) {
  return list.map(s => {
    const whole = WHOLE_UNITS.test(s.unit), l = stockLevel(s);
    const label = s.unit === '₹' ? `${s.name}: value left at cost price` : `${s.name} (${s.unit})`;
    return field(label, numIn(rec.counts[s.id], v => {
      if (v === '') delete rec.counts[s.id]; else rec.counts[s.id] = whole ? Math.round(v) : v;
    }, {placeholder: l.level != null ? `expected about ${stockQty(s, Math.max(0, l.level - (l.perDay || 0)))}` : 'left now', inputmode: whole || s.unit === '₹' ? 'numeric' : 'decimal'}));
  });
}

/* Workers: daily attendance (present / half day / absent + overtime), daily pay, advances, leaving and rejoining. */
function attRecord(date) {
  const att = Object.assign({id: 'att:' + date, kind: 'att', date, marks: {}, ot: {}}, attOf(date) || {});
  att.marks = Object.assign({}, att.marks); att.ot = Object.assign({}, att.ot);
  return att;
}
/** Everyone not marked yet is present (P1-4: tap only the exceptions). */
function markAllPresent(date) {
  const att = attRecord(date);
  let n = 0;
  workers().forEach(w => { if (!att.marks[w.id] && (!w.joined || w.joined <= date)) { att.marks[w.id] = 'P'; n++; } });
  if (n) save(att);
  return n;
}
/** Attendance list for one day; used by the Workers screen and the Close-the-day flow. */
function attendanceList(date, onChange) {
  const ws = workers(), att = attRecord(date), showPay = can('setup');
  return h('div', {class: 'list'}, ws.map(w => {
    const bal = showPay ? workerBalance(w) : null;
    const otIn = numIn(att.ot[w.id], v => { if (v) att.ot[w.id] = v; else delete att.ot[w.id]; save(att); onChange(); }, {placeholder: '0', style: 'max-width:80px', 'aria-label': 'Overtime hours for ' + w.name});
    const paid = get(wpayId(date, w));
    return h('div', {class: 'card', style: 'margin:0'},

        bal ? h('span', {class: 'small ' + (bal.due > 0 ? 'down' : 'muted')}, paid ? `paid ${rs(paid.amount)} ✓` : bal.due > 0 ? `owed ${rs(bal.due)}` : bal.due < 0 ? `advance ${rs(-bal.due)}` : 'settled') : null),
      h('div', {class: 'small muted'}, [w.role, shopName(w.shop), showPay && w.pay ? `${rs(w.pay)}/day` : null].filter(Boolean).join(' · ')),
      h('div', {style: 'margin-top:8px'}, seg([['P', 'Present'], ['H', 'Half day'], ['A', 'Absent']], att.marks[w.id] || '', v => { att.marks[w.id] = v; save(att); onChange(); })),
      h('div', {class: 'row', style: 'margin-top:8px'}, h('span', {class: 'small muted grow'}, 'Overtime hours'), otIn));
  }));
}
/** "Pay everyone today's wage" with Cash / UPI. Cash comes out of each worker's own shop box. */
function payEveryoneBar(date, onDone) {
  const due = workers().filter(w => wageFor(w, date) > 0 && !get(wpayId(date, w)));
  if (!can('setup') || !due.length) return null;
  const total = sumBy(due, w => Math.round(wageFor(w, date)));
  let pay = 'cash';
  return h('div', {class: 'card'},
    h('p', {class: 'eyebrow'}, `Pay today's wages · ${due.length} worker${due.length === 1 ? '' : 's'} · ${rs(total)}`),
    seg([['cash', 'Cash (from their shop box)'], ['upi', 'UPI']], pay, v => { pay = v; }),
    h('button', {type: 'button', class: 'btn btn--primary btn--block', style: 'margin-top:8px', onclick: () => { const m = payEveryone(date, pay); toast(`${m.length} payment${m.length === 1 ? '' : 's'} saved`); onDone(); }}, 'Pay everyone'));
}

function screenWorkers(view) {

  const date = curDate, ws = workers(), showPay = can('setup');

// One worker: this month's sheet and payments (I5, I16).
function workerSheet(w) {
  const t = today(), from = t.slice(0, 8) + '01';
  let present = 0, half = 0, absent = 0, ot = 0, earned = 0;
  range(from, t).forEach(d => { const a = attOf(d); if (!a || !a.marks) return; const m = a.marks[w.id]; if (m === 'P') present++; if (m === 'H') half++; if (m === 'A') absent++; ot += Number((a.ot || {})[w.id]) || 0; earned += wageFor(w, d); });
  const pays = all('wpay').filter(p => p.worker === w.id).sort((a, b) => a.date < b.date ? 1 : -1);
  const month = pays.filter(p => p.date >= from);
  const sum = type => sumBy(month.filter(p => p.type === type), p => p.amount);
  const bal = workerBalance(w);
  const p = {kind: 'wpay', worker: w.id, date: t, type: 'salary', amount: '', pay: 'cash'};
  const TYPES = {salary: 'Wage', advance: 'Advance', bonus: 'Bonus', returned: 'Advance returned', writeoff: 'Advance written off'};
  sheet(w.name, close => h('div', {},
    h('div', {class: 'tiles'}, tile(bal.due >= 0 ? 'Owed now' : 'Advance given', rs(Math.abs(bal.due)), 'all time'), tile('Earned this month', rs(earned), `${present} full · ${half} half · ${absent} absent`)),
    h('table', {class: 't'},
      [['Overtime hours', qty(ot)], ['Wages paid this month', rs(sum('salary'))], ['Advances this month', rs(sum('advance'))], ['Bonus this month', rs(sum('bonus'))]]
        .map(([a, b]) => h('tr', {}, h('td', {}, a), h('td', {class: 'r'}, b)))),
    h('h3', {class: 'h3'}, 'Record a payment'),
    field('Type', seg([['salary', 'Wage'], ['advance', 'Advance'], ['bonus', 'Bonus'], ['returned', 'Returned']], p.type, v => { p.type = v; })),
    field('Amount', moneyIn(bal.due > 0 ? Math.round(bal.due) : '', v => { p.amount = v; })),
    field('Paid by', seg([['cash', `Cash (${shopName(w.shop === 'chaat' ? 'chaat' : 'tea')} box)`], ['upi', 'UPI']], p.pay, v => { p.pay = v; })),
    h('button', {type: 'button', class: 'btn btn--primary btn--big btn--block', onclick: () => {
      if (p.amount === '' && bal.due > 0) p.amount = Math.round(bal.due);
      if (!(Number(p.amount) > 0)) { toast('Enter the amount'); return; }
      if (p.pay === 'cash') p.box = w.shop === 'chaat' ? 'chaat' : 'tea';
      save(p); close(); toast('Payment saved'); go(route);
    }}, 'Save payment'),
    h('h3', {class: 'h3'}, 'Recent payments'),
    pays.length ? h('table', {class: 't'}, pays.slice(0, 15).map(x => h('tr', {}, h('td', {}, dateLabel(x.date)), h('td', {}, TYPES[x.type] || x.type), h('td', {class: 'r'}, rs(x.amount)),
      h('td', {class: 'r'}, h('button', {type: 'button', class: 'link', onclick: () => { remove(x.id); close(); toast('Payment removed'); go(route); }}, 'Remove')))))
      : h('p', {class: 'muted'}, 'No payments yet.'),
    h('button', {type: 'button', class: 'btn btn--ghost btn--block', style: 'margin-top:12px', onclick: () => { close(); workerForm(w); }}, 'Edit worker details')));
}

/* Cash tally, one per shop box (H16–H18, P0-4): expected cash vs counted, by notes or as one total. */
const NOTES = [500, 200, 100, 50, 20, 10, 5, 2, 1];
function cashRecord(date, shop) {
  const rec = Object.assign({id: `cash:${date}:${shop}`, kind: 'cash', date, shop, notes: {}}, get(`cash:${date}:${shop}`) || {});
  rec.notes = Object.assign({}, rec.notes);
  if (!rec.mode) rec.mode = settings().cashMode || 'total';
  return rec;
}
/** The counting part, for one shop box. Used here and in Close the day. */
function cashCounter(date, shop) {
  const ex = expectedCash(date, shop), rec = cashRecord(date, shop);
  const wrap = h('div', {});
  const countedEl = h('div', {class: 'tile__v'}), diffEl = h('div', {class: 'tile__v'});
  const total = () => rec.mode === 'total' ? Number(rec.total) || 0 : NOTES.reduce((a, n) => a + n * (Number(rec.notes[n]) || 0), 0);
  const upd = () => {
    const c = total(), d = c - ex.expected, any = rec.mode === 'total' ? rec.total !== '' && rec.total != null : Object.keys(rec.notes).length > 0;
    countedEl.textContent = any ? rs(c) : '–';
    diffEl.textContent = !any ? '–' : Math.abs(d) < 1 ? 'Matches ✓' : (d < 0 ? 'Short ' : 'Extra ') + rs(Math.abs(d));
    diffEl.className = 'tile__v ' + (!any ? 'muted' : Math.abs(d) < 1 ? 'up' : 'down');
  };
  let t = null;
  const persist = () => { clearTimeout(t); t = setTimeout(() => { rec.counted = total(); rec.expected = ex.expected; rec.diff = rec.counted - ex.expected; save(rec); }, 500); };
  const counter = h('div', {});
  const drawCounter = () => {
    counter.innerHTML = '';
    if (rec.mode === 'total') counter.append(field('Cash in the box now', moneyIn(rec.total, v => { rec.total = v; persist(); upd(); }, {inputmode: 'numeric'})));
    else counter.append(h('div', {class: 'grid2'}, NOTES.map(n => field(n >= 10 ? `₹${n} notes` : `₹${n} coins`,
      numIn(rec.notes[n], v => { if (v) rec.notes[n] = v; else delete rec.notes[n]; persist(); upd(); }, {inputmode: 'numeric', placeholder: 'how many'})))));
  };
  wrap.append(
    h('table', {class: 't'},
      [['Change kept at opening', '+ ' + rs(ex.float)], ['Cash sales', '+ ' + rs(ex.sales)], ['Cash spent from this box', '− ' + rs(ex.spent)],
        ['Wages paid in cash', (ex.wages < 0 ? '+ ' : '− ') + rs(Math.abs(ex.wages))], ex.petty ? ['Petty cash given (net)', (ex.petty < 0 ? '+ ' : '− ') + rs(Math.abs(ex.petty))] : null]
        .filter(Boolean).map(([a, b]) => h('tr', {}, h('td', {}, a), h('td', {class: 'r'}, b))),
      h('tr', {}, h('th', {}, 'Should be in the box'), h('th', {class: 'r'}, rs(ex.expected)))),
    !saleTotals(date, shop).entered ? h('p', {class: 'small down', style: 'margin-top:6px'}, 'Enter the cash sales first, so this is right.') : null,
    h('div', {style: 'margin-top:10px'}, seg([['total', 'Type the total'], ['notes', 'Count notes']], rec.mode, v => { rec.mode = v; drawCounter(); upd(); persist(); })),
    counter,
    h('div', {class: 'tiles'}, h('div', {class: 'tile'}, h('div', {class: 'tile__l'}, 'Counted'), countedEl), h('div', {class: 'tile'}, h('div', {class: 'tile__l'}, 'Difference'), diffEl)));
  drawCounter(); upd();
  return wrap;
}
function screenCash(view) {

/* Close the day (P1-1): one guided flow for the whole closing routine. Every step can be skipped,
   progress is saved, and it opens on the oldest day not yet closed (P0-7). */
let closeDate = null;
function closeRecord(date) { return Object.assign({id: 'close:' + date, kind: 'close', date, step: 0, done: false}, get('close:' + date) || {}); }

function closeSteps(date) {
  const open = SHOP_KEYS.filter(s => isOpen(s, date));
  const counted = open.filter(s => salesMode(s) === 'items');
  const steps = [{k: 'money', t: 'Money'}];
  if (counted.length) steps.push({k: 'items', t: 'Items sold'});
  steps.push({k: 'spend', t: 'Spending'});
  if (stockItems().some(s => s.key)) steps.push({k: 'stock', t: 'Stock left'});
  if (workers().length) steps.push({k: 'workers', t: 'Workers'});
  steps.push({k: 'cash', t: 'Cash count'}, {k: 'summary', t: 'Summary'});
  return steps;
}

function screenClose(view) {
  if (!closeDate) closeDate = closingDay();
  const date = closeDate, t = today();
  const rec = closeRecord(date), steps = closeSteps(date);
  const at = rec.done ? steps.length - 1 : Math.min(rec.step || 0, steps.length - 1);
  const goStep = n => { save(Object.assign(closeRecord(date), {step: n})); go('close'); };
  const changeDay = n => { closeDate = addDays(date, n); go('close'); };

  view.append(h('div', {class: 'row row--between', style: 'margin-top:6px'},
    h('button', {type: 'button', class: 'iconbtn', 'aria-label': 'Day before', onclick: () => changeDay(-1)}, '‹'),
    bigDate(rec.done ? 'Closed ✓' : 'Closing', date),
    h('button', {type: 'button', class: 'iconbtn', 'aria-label': 'Next day', disabled: date >= t, onclick: () => changeDay(1)}, '›')));
  if (date < t && !rec.done) view.append(h('p', {class: 'small muted', style: 'text-align:center'}, `This is ${dateLabel(date).toLowerCase()}, the oldest day not closed yet.`));
  view.append(h('div', {class: 'steps', role: 'list'}, steps.map((s, i) => h('button', {type: 'button', role: 'listitem', class: 'steps__s' + (i === at ? ' on' : i < at ? ' done' : ''), 'aria-current': i === at ? 'step' : null, onclick: () => goStep(i)}, h('i'), h('span', {}, s.t)))));

  const body = h('div', {class: 'stepbody'});
  view.append(body);
  const step = steps[at];
  try { CLOSE_STEPS[step.k](body, date); } catch (e) { console.error(e); body.append(h('div', {class: 'alert alert--bad'}, 'Something went wrong on this step: ' + e.message)); }

  if (step.k !== 'summary') view.append(h('div', {class: 'grid2', style: 'margin-top:14px'},
    h('button', {type: 'button', class: 'btn btn--ghost btn--big', disabled: at === 0, onclick: () => goStep(at - 1)}, 'Back'),
    h('button', {type: 'button', class: 'btn btn--primary btn--big', onclick: () => goStep(at + 1)}, 'Next')));
}

const CLOSE_STEPS = {
  money(body, date) {
    body.append(h('p', {class: 'muted small'}, 'Read UPI from the soundbox or the merchant app total. Leave a shop blank to skip it.'));
    SHOP_KEYS.filter(s => isOpen(s, date)).forEach(shop => {
      const rec = saleRecord(date, shop);
      let saveT = null;
      const persist = () => { clearTimeout(saveT); saveT = setTimeout(() => save(rec), 300); };
      const more = h('div', {hidden: !(rec.unpaid || rec.short || rec.note)},
        h('div', {class: 'grid2'}, field('Left without paying', moneyIn(rec.unpaid, v => { rec.unpaid = v; persist(); })), field('Change short', moneyIn(rec.short, v => { rec.short = v; persist(); }))),
        field('Note', textIn(rec.note, v => { rec.note = v; persist(); })));
      body.append(h('div', {class: 'card'}, h('p', {class: 'eyebrow'}, `${shopName(shop)} shop`),
        moneyFields(rec, persist, {brief: true}), more,
        more.hidden ? h('button', {type: 'button', class: 'link', onclick: e => { more.hidden = false; e.target.remove(); }}, '+ Unpaid, change short or a note') : null));
    });
  },
  items(body, date) {
    SHOP_KEYS.filter(s => isOpen(s, date) && salesMode(s) === 'items').forEach(shop => {
      const rec = saleRecord(date, shop);
      const fromTally = prefillFromTally(rec);
      if (fromTally) save(rec);
      const sumEl = h('p', {class: 'small'});
      const upd = () => { const g = gapText(rec, shop); sumEl.className = 'small ' + g.cls; sumEl.textContent = g.text; };
      let saveT = null;
      body.append(h('div', {class: 'row row--between'}, h('h3', {class: 'h3'}, shopName(shop)), sumEl),
        fromTally ? h('p', {class: 'small muted'}, 'Filled in from the counter tally. Fix any that are wrong.') : null,
        itemGrid(rec, shop, () => { clearTimeout(saveT); saveT = setTimeout(() => save(rec), 300); upd(); }));
      upd();
    });
  },
  spend(body, date) {
    suppliers().forEach(sup => body.append(supplierCard(sup, date)));
    const rep = repeatList(date, () => go('close'));
    if (rep) body.append(rep);
    const list = onDate('expense', date).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
    body.append(h('div', {class: 'row row--between', style: 'margin:12px 0 6px'}, h('p', {class: 'eyebrow'}, `Spent ${dateLabel(date).toLowerCase()} · ${list.length}`), h('b', {class: 'num'}, rs(sumBy(list, e => e.amount)))));
    if (list.length) body.append(expenseList(list));
    body.append(h('button', {type: 'button', class: 'btn btn--soft btn--block', style: 'margin-top:10px', onclick: () => { curDate = date; expenseForm(null, {date}); }}, '+ Add other'));
  },
  stock(body, date) {
    const rec = countRecord(date);
    let saveT = null;

function closeText(date) {

  lines.push(`Total: ${rs(d.sales)}`);
  if (money) {
    lines.push('Costs: ' + d.lines.map(l => `${l.label} ${rs(l.amount)}`).join(', '));
    const pt = profitTrend(date, 'both');

  }
  SHOP_KEYS.forEach(s => { const c = get(`cash:${date}:${s}`); if (c && c.counted != null && Math.abs(c.diff) >= 1) lines.push(`${shopName(s)} box ${c.diff < 0 ? 'short' : 'extra'} ${rs(Math.abs(c.diff))}`); });

/* Live plate tally for the chaat counter (P1-3). A phone kept at the counter: pictures only,

function tallyMode() { return typeof route !== 'undefined' && route === 'tally'; }
function screenTally(app) {
  const shop = 'chaat', date = today();
  const id = `tally:${date}:${shop}`;
  const rec = Object.assign({id, kind: 'tally', date, shop, counts: {}, log: []}, get(id) || {});
  rec.counts = Object.assign({}, rec.counts); rec.log = (rec.log || []).slice(-300);
  let saveT = null;
  const persist = () => { clearTimeout(saveT); saveT = setTimeout(() => save(rec), 400); };
  const list = items(shop).filter(i => !i.parcel);
  const badges = {};
  const totalEl = h('span', {class: 'tally__total'});
  const upd = () => {
    list.forEach(it => { const n = rec.counts[it.id] || 0; badges[it.id].textContent = n || ''; badges[it.id].hidden = !n; });
    totalEl.textContent = sumBy(Object.keys(rec.counts), k => rec.counts[k]);
  };
  const tapped = (it, tileEl) => {

    if (navigator.vibrate) navigator.vibrate(30);

  const exitBtn = h('button', {type: 'button', class: 'tally__exit', 'aria-label': 'Hold to leave the tally'}, '✕');
  const startHold = () => { exitBtn.classList.add('holding'); holdT = setTimeout(() => { save(rec); history.replaceState(null, '', location.pathname); go('home'); }, 1500); };
  const stopHold = () => { exitBtn.classList.remove('holding'); clearTimeout(holdT); };
  ['pointerdown', 'touchstart'].forEach(ev => exitBtn.addEventListener(ev, e => { e.preventDefault(); startHold(); }));
  ['pointerup', 'pointerleave', 'touchend', 'touchcancel'].forEach(ev => exitBtn.addEventListener(ev, stopHold));

  const grid = h('div', {class: 'tally__grid'}, list.map((it, i) => {
    const badge = h('span', {class: 'tally__n'});
    badges[it.id] = badge;
    const t = h('button', {type: 'button', class: 'tally__t', style: `--hue:${(i * 47) % 360}`, 'aria-label': it.name}, itemPic(it, 'tally__img'), badge);
    t.addEventListener('click', () => tapped(it, t));
    return t;
  }));
  app.append(h('main', {class: 'tally'}, exitBtn, grid,
    h('div', {class: 'tally__bar'}, h('button', {type: 'button', class: 'tally__undo', onclick: undo, 'aria-label': 'Undo last plate'}, '↶'), totalEl)));
  upd();
  // A new business day starts a fresh tally.
  const tick = setInterval(() => { if (route !== 'tally') { clearInterval(tick); return; } if (today() !== date) { clearInterval(tick); render(); } }, 60000);

const MONEY_KEYS = {cash: 'Cash', upi: 'UPI', amount: 'Amount', unpaid: 'Left without paying', short: 'Change short', counted: 'Counted', price: 'Price', rate: 'Rate'};
const MARK = {P: 'present', H: 'half day', A: 'absent'};
/** Readable list of what changed between two versions of a record, e.g. "UPI ₹6,930 → ₹5,930". */
function changes(a, b) {
  const out = [];
  const name = id => { const r = get(id); return r ? r.name : id; };
  Object.keys(MONEY_KEYS).forEach(k => { if ((Number(a[k]) || 0) !== (Number(b[k]) || 0)) out.push(`${MONEY_KEYS[k]} ${rs(a[k])} → ${rs(b[k])}`); });
  if (a.kind === 'worker' && Number(a.pay) !== Number(b.pay)) out.push(`Pay ${rs(a.pay)} → ${rs(b.pay)}`);
  if (a.qty !== b.qty && (a.qty != null || b.qty != null)) out.push(`Qty ${qty(a.qty)} → ${qty(b.qty)}`);
  if (a.cat !== b.cat && a.cat) out.push(`${a.cat} → ${b.cat}`);
  if (a.date !== b.date && a.kind === 'expense') out.push(`Date ${a.date} → ${b.date}`);
  ['counts', 'marks', 'ot'].forEach(k => {
    const x = a[k] || {}, y = b[k] || {};
    new Set(Object.keys(x).concat(Object.keys(y))).forEach(id => {
      if (x[id] === y[id]) return;
      const f = v => k === 'marks' ? (MARK[v] || 'not marked') : (v || 0);
      out.push(`${name(id)}${k === 'ot' ? ' overtime' : ''} ${f(x[id])} → ${f(y[id])}`);
    });
  });
  return out;
}
function describe(o) {
  switch (o.kind) {
    case 'sale': return `${shopName(o.shop)} sales for ${o.date} (cash ${rs(o.cash)}, UPI ${rs(o.upi)})`;
    case 'expense': return `expense ${o.cat} ${rs(o.amount)} on ${o.date}`;
    case 'delivery': { const s = get(o.supplier); return `${s ? s.name : 'delivery'}: ${qty(o.qty)} on ${o.date}`; }
    case 'cash': return `cash tally ${shopName(o.shop)} ${o.date}`;
    case 'count': return `stock count ${o.date}`;
    case 'att': return `attendance ${o.date}`;
    case 'tally': return `counter tally ${o.date}`;
    case 'close': return `closing for ${o.date}`;
    case 'petty': { const w = get(o.worker); return `petty cash ${o.type === 'give' ? 'to' : 'from'} ${w ? w.name : 'a worker'} ${rs(o.amount)}`; }
    case 'wpay': { const w = get(o.worker); return `${o.type} ${rs(o.amount)} to ${w ? w.name : 'a worker'}`; }
    case 'item': return `item ${o.name} (${rs(o.price)})`;
    case 'worker': return `worker ${o.name}`;
    case 'supplier': return `supplier ${o.name}`;
    case 'settings': return 'shop settings';
    default: return o.kind || 'a record';
  }
}

// The server, faked: sync does nothing, history is built from the records on this phone.
async function demoApi(op, body) {
  switch (op) {
    case 'sync': return {ok: true, seq: S.seq, changes: [], user: DEMO_USER};
    case 'users':
      if (body.action === 'save') throw new Error('Logins can’t be changed in the demo.');
      return {ok: true, users: [
        {username: 'owner', name: 'Shop owner', role: 'owner', active: true},
        {username: 'brother', name: 'Brother', role: 'family', active: true},
        {username: 'counter', name: 'Chaat counter phone', role: 'cashier', active: true}]};
    case 'history': {
      const rows = Array.from(S.recs.values()).filter(r => r.updatedAt && !['item', 'stock', 'settings', 'supplier', 'worker'].includes(r.kind))
        .sort((a, b) => b.updatedAt - a.updatedAt).slice(0, 120)
        .map(r => ({time: new Date(r.updatedAt).toLocaleString('en-IN'), user: r.by || 'owner', action: r.deleted ? 'delete' : 'update', kind: r.kind, id: r.id, json: JSON.stringify(clean(r)), before: r._before ? JSON.stringify(r._before) : ''}));
      return {ok: true, rows};
    }
    case 'photo': return {ok: true, url: '#demo-photo'};
    case 'sheets': throw new Error('The Google Sheet export is not part of the demo.');
    default: throw new Error('Not available in the demo.');
  }
}

async function demoSeed() {
  let seed = 11;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const vary = (n, spread) => Math.max(0, Math.round(n * (1 + (rnd() * 2 - 1) * (spread || 0.15))));
  const t = today();
  let n = 0;
  const put = (r, date) => { r.updatedAt = parseD(date).getTime() + 23 * 36e5 + (n++); r.by = r.by || 'owner'; S.recs.set(r.id, r); return r; };
  SEED.records().forEach(r => put(r, '2026-10-14'));
  const st = get('settings'); st.demoBuilt = 1;
  const chaatFrom = st.shops.chaat.opened, teaFrom = st.shops.tea.opened;
  const item = name => all('item').find(i => i.name === name);
  const stock = name => all('stock').find(s => s.name === name);
  bump();
  // His five workers (names made up).
  ['Manju', 'Ravi', 'Kiran', 'Raju', 'Suresh'].forEach((name, i) => { const w = get('worker:seed' + (i + 1)); if (w) w.name = name; });
  const ws = all('worker');
  const sup = get('supplier:milk');

  // Typical weekday plates at the chaat counter: about 95 plates, about ₹4,000 (D2).
  const CHAAT = {'Pani puri': 38, 'Masala puri': 11, 'Sev puri': 6, 'Dahi puri': 5, 'Bhel puri': 8, 'Nippattu masala': 3, 'Samosa chaat': 7,
    'Kachori chaat': 3, 'Churumuri': 5, 'Papdi chaat': 3, 'Water bottle / cool drink': 7, 'Parcel charge': 5};
  const level = {'Milk': 1, 'Tea powder': 4, 'Sugar': 10, 'Cigarettes (₹ value)': 14000, 'Oil': 4, 'Puris': 2, 'Gas cylinders (full)': 1, 'Coffee powder': 1, 'Paper plates': 200, 'Water bottles': 24, 'Cool drinks': 12};
  const gasNext = {Tea: teaFrom, Chaat: chaatFrom};
  const expense = (date, cat, shop, amount, pay, extra) => put(Object.assign({id: `expense:demo:${date}:${n}`, kind: 'expense', date, cat, shop, amount: Math.round(amount), pay,
    box: pay === 'cash' ? (shop === 'chaat' ? 'chaat' : 'tea') : undefined}, extra || {}), date);
  const buy = (date, cat, shop, amount, pay, stockName, q, extra) => { const s = stock(stockName); expense(date, cat, shop, amount, pay, Object.assign({stock: s && s.id, qty: q}, extra || {})); level[stockName] += q; };

  for (let d = chaatFrom; d <= t; d = addDays(d, 1)) {
    const isToday = d === t, teaOpen = d >= teaFrom, dow = parseD(d).getDay();
    const weekend = dow === 0 || dow === 6;
    const k = daysBetween(chaatFrom, d);
    const rain = k % 13 === 5, holiday = d === '2026-11-01';
    if (rain || holiday) put({id: 'tag:' + d, kind: 'tag', date: d, tags: [rain ? 'Rain' : 'Holiday']}, d);
    const f = (weekend ? 0.85 : 1) * (rain ? 0.6 : 1) * (holiday ? 0.8 : 1);

    // Chaat: live tally at the counter, copied into the closing entry.
    const counts = {}, prices = {};
    let value = 0, plates = 0;
    Object.keys(CHAAT).forEach(name => {
      const it = item(name); if (!it || it.active === false || !it.price) return;
      const c = vary(CHAAT[name] * f * (isToday ? 0.55 : 1), 0.2);
      if (!c) return;
      counts[it.id] = c; prices[it.id] = it.price; value += c * it.price;
      if (/pani puri|masala puri/i.test(name)) plates += c;
    });
    put({id: `tally:${d}:chaat`, kind: 'tally', date: d, shop: 'chaat', counts: Object.assign({}, counts), log: [], by: 'counter'}, d);
    if (!isToday) {
      const short = rnd() < 0.2 ? 20 + Math.round(rnd() * 4) * 10 : 0;
      const upi = Math.round((value - short) * 0.9 / 10) * 10;
      put({id: `sale:${d}:chaat`, kind: 'sale', date: d, shop: 'chaat', counts, prices, cash: value - short - upi, upi, unpaid: '', short: short ? 10 : '', note: rain ? 'Rain from 6 pm' : ''}, d);
    }
    // Tea: money only (H2). About ₹20,100 a day, 42% of it cigarettes.
    if (teaOpen && !isToday) {
      const total = Math.round(vary(20100 * (weekend ? 0.82 : 1) * (rain ? 0.85 : 1) * (holiday ? 0.7 : 1), 0.08) / 10) * 10;
      const upi = Math.round(total * 0.9 / 10) * 10;
      put({id: `sale:${d}:tea`, kind: 'sale', date: d, shop: 'tea', counts: {}, prices: {}, cash: total - upi, upi, unpaid: '', short: ''}, d);
    }

    // Spending.
    if (teaOpen) {
      if (d === teaFrom || (daysBetween(teaFrom, d) % 10 === 0)) expense(d, 'Supplier advance', 'tea', 30400, 'upi', {supplier: sup.id});
      put({id: deliveryId(d, sup.id), kind: 'delivery', supplier: sup.id, date: d, qty: 38, rate: 80, amount: 3040, shop: 'tea'}, d);
      level['Milk'] += 38;
      if (level['Tea powder'] < 3) buy(d, 'Groceries', 'tea', 6 * 320, 'upi', 'Tea powder', 6, {note: 'Tea powder'});
      if (level['Sugar'] < 6) buy(d, 'Groceries', 'tea', 25 * 45, 'cash', 'Sugar', 25, {note: 'Sugar'});
      if (level['Cigarettes (₹ value)'] < 9000) buy(d, 'Cigarettes & resale', 'tea', 21675, 'upi', 'Cigarettes (₹ value)', 21675, {note: 'Cigarette boxes'});
      if (!isToday) expense(d, 'Staff food', 'tea', 450, 'cash');
      if (dow === 1) expense(d, 'Cleaning', 'tea', 150, 'cash');
    }
    if (!isToday) {
      expense(d, 'Vegetables', 'chaat', vary(350, 0.2), 'cash');
      expense(d, 'Groceries', 'chaat', vary(300, 0.2), 'cash', {note: 'Sev, curd, chutney'});
      expense(d, 'Staff food', 'chaat', 300, 'cash');
      if (k % 3 === 0) buy(d, 'Disposables', 'chaat', 200, 'cash', 'Paper plates', 250);
    }
    if (level['Puris'] < 1) buy(d, 'Puris & snacks', 'chaat', 2 * 600, 'upi', 'Puris', 2);
    if (level['Oil'] < 1.5) buy(d, 'Groceries', 'chaat', 5 * 150, 'cash', 'Oil', 5, {note: 'Oil'});
    // Gas: tea about every 2.5 days, chaat every 10 (J2).
    Object.keys(gasNext).forEach(c => {
      if (c === 'Tea' && !teaOpen) return;
      if (d >= gasNext[c]) { expense(d, 'Gas', c === 'Tea' ? 'tea' : 'chaat', 2780, 'upi', {counter: c}); gasNext[c] = addDays(d, c === 'Tea' ? (rnd() < 0.5 ? 2 : 3) : 10); }
    });
    if (d.slice(8) === '01' || d === chaatFrom) expense(d, 'Rent', 'chaat', 40000, 'upi');
    if (d === teaFrom) expense(d, 'Rent', 'tea', 48000, 'upi');
    if (d.slice(8) === '05') expense(d, 'Electricity', 'shared', 3000, 'upi');

    // Workers: all present except the odd absence; paid daily at closing (I3).
    const marks = {}, ot = {};
    ws.forEach(w => { if (d < w.joined) return; const r = rnd(); marks[w.id] = r < 0.05 ? 'A' : r < 0.08 ? 'H' : 'P'; });
    put({id: 'att:' + d, kind: 'att', date: d, marks, ot}, d);
    if (!isToday) ws.forEach(w => {
      const m = marks[w.id]; if (!m || m === 'A') return;
      put({id: `wpay:${d}:${w.id}`, kind: 'wpay', worker: w.id, date: d, type: 'salary', amount: (m === 'H' ? 0.5 : 1) * w.pay, pay: 'cash', box: w.shop, daily: true}, d);
    });
    if (d === addDays(t, -3)) put({id: 'wpay:adv:demo', kind: 'wpay', worker: ws[4].id, date: d, type: 'advance', amount: 1000, pay: 'cash', box: 'chaat', note: 'Family function'}, d);

    // Stock left at closing (whole buckets and pieces).
    if (!isToday) {
      const use = {'Milk': teaOpen ? 37.5 : 0, 'Tea powder': teaOpen ? 1.7 : 0, 'Sugar': teaOpen ? 4.5 : 0, 'Cigarettes (₹ value)': teaOpen ? 425 * 17 * (weekend ? 0.85 : 1) : 0,
        'Oil': 0.5, 'Puris': plates * 8 / 900, 'Paper plates': 90 * f, 'Coffee powder': teaOpen ? 0.05 : 0};
      const cnt = {};
      Object.keys(use).forEach(name => {
        level[name] = Math.max(0, level[name] - use[name] * (0.92 + rnd() * 0.16));
        const s = stock(name); if (!s || (s.shop === 'tea' && !teaOpen)) return;
        cnt[s.id] = WHOLE_UNITS.test(s.unit) ? Math.round(level[name]) : s.unit === '₹' ? Math.round(level[name] / 10) * 10 : Math.round(level[name] * 10) / 10;
      });
      put({id: 'count:' + d, kind: 'count', date: d, counts: cnt}, d);
      put({id: 'close:' + d, kind: 'close', date: d, step: 6, done: true}, d);
    }
  }
  bump();
  // Cash count at closing: matches what should be in the box, with the odd small shortage.
  for (let d = chaatFrom; d < t; d = addDays(d, 1)) {
    SHOP_KEYS.filter(s => isOpen(s, d)).forEach(shop => {
      const ex = expectedCash(d, shop).expected;
      const counted = Math.round(ex - (rnd() < 0.15 ? 10 + Math.round(rnd() * 5) * 10 : 0));
      put({id: `cash:${d}:${shop}`, kind: 'cash', date: d, shop, mode: 'total', notes: {}, total: counted, counted, expected: ex, diff: counted - ex}, d);
    });
  }
  bump();
  await DB.putMany(Array.from(S.recs.values()));
}

/* App shell: sign-in, PIN lock, tabs, routing, install button, offline service worker. */
// Tabs (P1-6): the daily closing lives in one tab; Sales, Expenses, Workers and Cash open from Home or More.
const tabsFor = () => [['home', 'Home'], ['close', 'Close day'], can('profit') ? ['reports', 'Reports'] : ['spend', 'Expenses'], ['stock', 'Stock'], ['more', 'More']];
const TITLES = {home: 'Today', close: 'Close the day', sales: 'Sales entry', spend: 'Expenses', stock: 'Stock', more: 'More', workers: 'Workers', cash: 'Cash tally', reports: 'Reports'};
const SCREENS = {home: screenHome, close: screenClose, sales: screenSales, spend: screenSpend, stock: screenStock, more: screenMore, workers: screenWorkers, cash: screenCash, reports: screenReports, tally: screenTally};
let route = /tally/.test(location.hash) ? 'tally' : 'home';
let backTo = 'more';
let installEvt = null;

function applyTheme() { document.documentElement.setAttribute('data-theme', LS.get('theme', 'dark')); }
function go(r) {
  const next = SCREENS[r] ? r : 'home';
  if (tabsFor().some(t => t[0] === route) && !tabsFor().some(t => t[0] === next)) backTo = route;
  if (next === 'close' && route !== 'close') closeDate = null;
  route = next;
  if (route === 'tally' && !/tally/.test(location.hash)) history.replaceState(null, '', '#tally');
  render(); window.scrollTo(0, 0);
}

function render() {
  const app = $('app');
  app.innerHTML = '';
  if (!S.session) { app.append(authScreen()); return; }
  if (isLocked()) { app.append(lockScreen()); return; }
  if (route === 'tally') { if (can('tally')) { screenTally(app); return; } route = 'home'; }
  const tabs = tabsFor();
  const isTab = tabs.some(t => t[0] === route);
  const tabOf = isTab ? route : backTo;
  const syncBtn = h('button', {type: 'button', class: 'sync', id: 'syncBtn', onclick: () => sync().then(() => toast('Synced'), e => toast('Not synced: ' + e.message))}, h('i'), h('span'));
  app.append(
    h('header', {class: 'top'}, h('div', {class: 'top__in'},
      !isTab ? h('button', {type: 'button', class: 'iconbtn', 'aria-label': 'Back', onclick: () => go(backTo)}, '‹') : null,
      h('h1', {}, TITLES[route]), syncBtn)),
    DEMO ? h('div', {class: 'demo-strip'}, 'Demo with made-up numbers. Tap anything; changes stay on this device only.') : null,
    (() => { const v = h('main', {class: 'view', id: 'view'}); try { SCREENS[route](v); } catch (e) { console.error(e); v.append(h('div', {class: 'alert alert--bad'}, 'Something went wrong on this screen: ' + e.message)); } return v; })(),
    h('nav', {class: 'tabs', 'aria-label': 'Main'}, h('div', {class: 'tabs__in'}, tabs.map(([k, l]) => h('button', {type: 'button', class: 'tab', 'aria-current': tabOf === k ? 'page' : null, onclick: () => go(k)}, icon(k), l)))));
  if (route === 'home') installBanner();
  drawSync();
}
function drawSync() {
  const b = $('syncBtn'); if (!b) return;
  if (DEMO) { b.dataset.s = 'ok'; b.lastChild.textContent = 'Demo'; return; }
  const n = pendingCount();
  const s = S.syncing ? 'busy' : !S.online ? 'off' : n ? 'busy' : 'ok';
  b.dataset.s = s;
  b.lastChild.textContent = S.syncing ? 'Syncing…' : !S.online ? (n ? `Offline · ${n} waiting` : 'Offline') : n ? `${n} to sync` : 'Synced';
}
S.listeners.add(() => { if (!S.session || isLocked()) { if (!$('pinpad')) render(); return; } drawSync(); });

// ---------- sign in ----------
function pinPad(onDone, label) {
  let pin = '';
  const dots = h('div', {class: 'dots', 'aria-label': 'PIN'});
  const draw = () => { dots.innerHTML = ''; for (let i = 0; i < 4; i++) dots.append(h('i', {class: i < pin.length ? 'on' : null})); };
  const press = k => {
    if (k === '⌫') pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
    draw();
    if (pin.length === 4) { const p = pin; pin = ''; setTimeout(() => { draw(); onDone(p); }, 120); }
  };
  draw();
  const pad = h('div', {class: 'pad', id: 'pinpad'}, ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map(k => k ? h('button', {type: 'button', 'aria-label': k === '⌫' ? 'Delete' : k, onclick: () => press(k)}, k) : h('span')));
  return h('div', {}, label ? h('p', {class: 'muted'}, label) : null, dots, pad);
}
function authScreen() {
  const wrap = h('div', {class: 'pin'});
  const msg = h('p', {class: 'down', role: 'alert'});
  let mode = 'login', user = LS.get('lastUser', '');
  const draw = () => {
    wrap.innerHTML = '';
    wrap.append(h('p', {class: 'eyebrow'}, 'Chaat & Tea'), h('div', {class: 'brand'}, 'Shop Manager'));
    if (!S.api || S.api.indexOf('http') !== 0) {
      let v = '';
      wrap.append(h('p', {class: 'muted'}, 'Paste the server link (ends in /exec).'), textIn('', x => { v = x.trim(); }),
        h('button', {type: 'button', class: 'btn btn--primary btn--block', style: 'margin-top:10px', onclick: () => { S.api = v; LS.set('api', v); draw(); }}, 'Continue'));
      return;
    }
    if (mode === 'login') {
      wrap.append(field('Username', textIn(user, v => { user = v.trim().toLowerCase(); }, {autocapitalize: 'none', autocomplete: 'username'})), msg,
        pinPad(pin => {
          if (!user) { msg.textContent = 'Enter your username first.'; return; }
          msg.textContent = 'Signing in…';
          signIn(user, pin).then(() => go('home'), e => { msg.textContent = e.message; });
        }, 'Enter your 4-digit PIN'),
        h('button', {type: 'button', class: 'link', style: 'margin-top:14px', onclick: () => { mode = 'owner'; draw(); }}, 'First time? Set up the app'));
    } else {
      const f = {code: '', name: '', user: '', pin: ''};
      wrap.append(h('p', {class: 'muted'}, 'One time only. Use the setup code from the server file.'),
        field('Setup code', textIn('', v => { f.code = v; }, {autocapitalize: 'characters'})),
        field('Your name', textIn('', v => { f.name = v; })),
        field('Username', textIn('', v => { f.user = v.trim().toLowerCase(); }, {autocapitalize: 'none'})),
        field('Choose a 4-digit PIN', textIn('', v => { f.pin = v.replace(/\D/g, '').slice(0, 4); }, {inputmode: 'numeric', maxlength: 4})), msg,
        h('button', {type: 'button', class: 'btn btn--primary btn--big btn--block', onclick: () => {
          msg.textContent = 'Creating…';
          createOwner(f.code, f.name, f.user, f.pin).then(() => go('home'), e => { msg.textContent = e.message; });
        }}, 'Create owner account'),
        h('button', {type: 'button', class: 'link', onclick: () => { mode = 'login'; draw(); }}, 'Back to sign in'));
    }
  };
  draw();
  return h('main', {class: 'view'}, wrap);
}
function lockScreen() {
  const msg = h('p', {class: 'down', role: 'alert'});
  return h('main', {class: 'view'}, h('div', {class: 'pin'}, h('div', {class: 'brand'}, 'Shop Manager'),
    h('p', {class: 'muted'}, `Hi ${S.session.user.name}`), msg,
    pinPad(pin => tryUnlock(pin).then(ok => { if (ok) render(); else msg.textContent = 'Wrong PIN. Try again.'; })),
    h('button', {type: 'button', class: 'link', style: 'margin-top:14px', onclick: () => { signOut(); render(); }}, 'Forgot PIN? Sign in again')));
}

// ---------- install (questionnaire M5: "a link to download from") ----------
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (route === 'home' && S.session) render(); });
function installBanner() {
  if (DEMO) return;
  const standalone = window.matchMedia && matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone || LS.get('installHidden', false)) return;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  if (!installEvt && !ios) return;
  const v = $('view');
  v.prepend(h('div', {class: 'alert alert--good'}, h('span', {}, '📲'),
    h('div', {class: 'grow'}, installEvt ? 'Install Shop Manager on this phone for one-tap opening, even offline.' : 'To install on iPhone: tap Share, then "Add to Home Screen".',
      installEvt ? h('div', {}, h('button', {type: 'button', class: 'link', onclick: () => { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); }}, 'Install app')) : null),
    h('button', {type: 'button', class: 'link', 'aria-label': 'Hide', onclick: () => { LS.set('installHidden', true); render(); }}, '×')));
}

// ---------- start ----------
applyTheme();
loadStore().then(() => {
  render();
  if (S.session) sync().catch(() => {});
  setInterval(() => { if (S.session && !document.hidden) sync().catch(() => {}); }, 5 * 60 * 1000);
});
if (!DEMO && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
window.__app = {S, go, save, remove, all, get, settings, today, addDays, daySummary, dayCost, periodSummary, profitTrend, monthCompare, itemTotals, forecast, prepPlan,
  stockLevel, shoppingList, workerBalance, expectedCash, payback, breakEven, supplierBalance, payEveryone, markAllPresent, closingDay, leakageCheck, labourCost, targetProgress, merge3, migrate, upgrade, cashSpent,
  run: src => eval(src)};   // run: lets the automated tests reach inside the app

})();
</script>
